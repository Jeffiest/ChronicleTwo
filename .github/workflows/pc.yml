name: PC builds

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Lavapipe renders on the CPU, so the unit tests' per-case limit is widened from its 5 second default.
      - name: Configure
        run: tools/kazarov/bin/kazarov shell cmake --preset linux-x64 -DCT_TEST_TIMEOUT=60

      - name: Build
        run: ./build.sh linux-x64

      - name: Run host compatibility fixtures
        run: tools/kazarov/bin/kazarov shell cmake --build port/build/pc --target ct_compatibility_tests

      - name: Test
        run: tools/kazarov/bin/kazarov shell ctest --test-dir port/build/pc --output-on-failure -j4

      # A non-PIE link places the game below 4 GiB, where a pointer truncated to 32 bits still works and hides the bug.
      - name: Check that darkchronicle is position-independent
        run: |
          tools/kazarov/bin/kazarov shell bash -c "llvm-readobj --file-headers port/build/pc/darkchronicle | grep -q 'Type: SharedObject'"

  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the toolchain and libraries
        run: |
          brew install llvm lld cmake ninja python glslang sdl3 vulkan-headers vulkan-loader vulkan-tools molten-vk \
            googletest nlohmann-json
          # SDL loads the Vulkan loader by name, and dyld does not search Homebrew's prefix.
          echo "SDL_VULKAN_LIBRARY=$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Describe the Vulkan driver
        run: |
          mkdir -p artifacts
          vulkaninfo --summary > artifacts/vulkaninfo.txt 2>&1 || true
          cat artifacts/vulkaninfo.txt

      - name: Configure
        run: cmake --preset macos-arm64 -DCT_TEST_TIMEOUT=60

      - name: Build
        run: cmake --build --preset macos-arm64

      - name: Run host compatibility fixtures
        run: cmake --build port/build/macos-arm64 --target ct_compatibility_tests

      - name: Test
        run: ctest --preset macos-arm64

      - name: Package the macOS build
        run: tar -czf artifacts/chronicletwo-macos-arm64.tar.gz -C port/build/macos-arm64 darkchronicle

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-macos-arm64
          path: artifacts/chronicletwo-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Upload the Vulkan description
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/vulkaninfo.txt
          if-no-files-found: warn

  windows:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner has no GPU and may have no Vulkan loader; the tests need the loader to start.
      - name: Install the toolchain and libraries
        run: |
          ./tools/windows/acquire.ps1 -Root $env:RUNNER_TEMP -VulkanLoader
          "VULKAN_RUNTIME=$env:RUNNER_TEMP/deps/vulkan-runtime/VulkanRT-X64-1.4.363.0-Components/x64" >> $env:GITHUB_ENV

      # configure.ps1 directly: configure-tests.ps1 links System32's vulkan-1.dll, which this runner may lack.
      - name: Configure
        run: |
          ./tools/windows/configure.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-tests -Tests `
            -VulkanLibrary $env:VULKAN_RUNTIME/vulkan-1.dll

      # Beside the executables, the downloaded loader is found before any in System32.
      - name: Build
        run: |
          ./tools/windows/build.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows-x64-tests -Tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build port/build/windows-x64-tests --target ct_compatibility_tests_headless
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $env:VULKAN_RUNTIME/vulkan-1.dll port/build/windows-x64-tests

      # The renderer's cases need a Vulkan device, which this runner does not have.
      - name: Test
        run: ctest --test-dir port/build/windows-x64-tests --output-on-failure -j4 -E '^(GfxMisc|TexDecode)\.'

      - name: Package the Windows build
        run: |
          $files = @('darkchronicle.exe', 'libc++.dll', 'libunwind.dll', 'libwinpthread-1.dll', 'SDL3.dll', 'vulkan-1.dll')
          $paths = $files | ForEach-Object { Join-Path 'port/build/windows-x64-tests' $_ }
          Compress-Archive -LiteralPath $paths -DestinationPath chronicletwo-windows-x64.zip

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: chronicletwo-windows-x64
          path: chronicletwo-windows-x64.zip
          if-no-files-found: error
