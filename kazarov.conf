# Kazarov project configuration for Chronicle Two. Sourced by tools/kazarov/bin/kazarov.
# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is read by the driver
KZ_PROJECT=chronicletwo
KZ_CONFIGS=(ps2-pal linux-x64 linux-x64-release macos-arm64 macos-arm64-release windows-x64 windows-x64-release)
KZ_DEFAULT_BUILD=ps2-pal
KZ_DEFAULT_RUN=ps2-pal
KZ_DEFAULT_BUILD_DARWIN=macos-arm64-release
KZ_DEFAULT_RUN_DARWIN=macos-arm64-release
KZ_DEFAULT_BUILD_WINDOWS=windows-x64-release
KZ_DEFAULT_RUN_WINDOWS=windows-x64-release
KZ_WINDOWS_HOST_SCRIPT=tools/windows/kazarov.ps1
KZ_WINDOWS_CONFIGS="windows-x64 windows-x64-release windows"
KZ_CONTAINER_CONFIGS="ps2 pal ps2-pal linux linux-x64 linux-x64-release linux-x64-debug macos macos-arm64 macos-arm64-release"
KZ_ENV_PASS=(SATANSFIDDLE SATANSFIDDLE_CONFIG)

# Names a configuration and sets how it is built and run. Returns 1 for an unknown name.
kz_config() {
    case $1 in
        ps2-pal|ps2|pal)
            KZ_CONFIG=ps2-pal
            KZ_WHERE=container
            KZ_BUILD_DIR=build/pal
            KZ_CMAKE_ARGS=(-DPLATFORM=PS2)
            KZ_SETUP_TARGETS=(setup)
            KZ_SETUP_STAMP=ps2/asm/pal.split-stamp
            KZ_BUILD_TARGETS=(build ctx objdiff)
            KZ_RUN_TARGETS=(iso)
            KZ_LOCKS=(ps2-pal)
            KZ_REQUIRE_ANY=("rom/pal/Dark Chronicle (PAL).iso" rom/pal/extracted/iso/SCES_511.90)
            KZ_REQUIRE_MESSAGE="kazarov: ps2-pal needs rom/pal/Dark Chronicle (PAL).iso or rom/pal/extracted/iso/SCES_511.90"
            KZ_RUN_ISO="build/pal/Dark Chronicle (PAL Build).iso" ;;
        linux|linux-x64-release)
            KZ_CONFIG=linux-x64-release
            KZ_WHERE=container
            KZ_PRESET=linux-x64-release
            KZ_BUILD_DIR=port/build/pc-release
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests)
            KZ_RUN_TARGETS=(all)
            KZ_RUN_OS=Linux
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        linux-x64-debug|linux-x64)
            KZ_CONFIG=linux-x64
            KZ_WHERE=container
            KZ_PRESET=linux-x64
            KZ_BUILD_DIR=port/build/pc
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests)
            KZ_RUN_TARGETS=(all)
            KZ_RUN_OS=Linux
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        macos|macos-arm64-release)
            KZ_CONFIG=macos-arm64-release
            KZ_WHERE=host
            KZ_HOST_OS=Darwin
            KZ_PRESET=macos-arm64-release
            KZ_BUILD_DIR=port/build/macos-arm64-release
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests)
            KZ_RUN_OS=Darwin
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        macos-arm64)
            KZ_CONFIG=macos-arm64
            KZ_WHERE=host
            KZ_HOST_OS=Darwin
            KZ_PRESET=macos-arm64
            KZ_BUILD_DIR=port/build/macos-arm64
            KZ_BUILD_TARGETS=(darkchronicle darkchronicle_tests)
            KZ_RUN_OS=Darwin
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkchronicle ;;
        windows|windows-x64-release)
            KZ_CONFIG=windows-x64-release
            KZ_WHERE=windows ;;
        windows-x64)
            KZ_CONFIG=windows-x64
            KZ_WHERE=windows ;;
        *) return 1 ;;
    esac
    return 0
}

# Reports progress after a default build.
kz_after_build() {
    case $KZ_CONFIG in
        ps2-*) python3 scripts/build/progress_report.py ;;
    esac
}

# Checks the rebuilt executable against retail; a mismatch is reported and the run goes on.
kz_after_run_build() {
    case $KZ_CONFIG in
        ps2-*)
            BUILD_DIR=build/pal python3 scripts/build/verify.py -c || echo "The build does not match retail; booting it anyway." >&2 ;;
    esac
}
